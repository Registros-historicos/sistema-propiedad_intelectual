<div class="card card-xl-stretch mb-xl-8">
  <!-- begin::Header -->
  <div class="card-header border-0 pt-5">
    <h3 class="card-title align-items-start flex-column">
      <span
        class="card-label fw-bolder fs-3 mb-1"
        translate="GRAPHICS.TITLES.INSTITUTIONS"
      ></span>
      <span
        class="text-muted mt-1 fw-bold fs-7"
        translate="GRAPHICS.SUBTITLES.TOP_5"
      ></span>
    </h3>
    <div class="card-toolbar">
      <div
        class="btn btn-sm btn-icon btn-bg-light btn-active-color-primary tooltip-css"
        (click)="onExportExcel()">
        <mat-icon style="color: #1d6f42">description</mat-icon>
        <span class="tooltip-text" translate="BUTTON.EXPORT_EXCEL"></span>
      </div>
    </div>
  </div>

  <div class="card-body py-3">
    <div class="table-responsive" style="max-height: 400px; overflow-y: auto">
      <table class="table align-middle gs-0 gy-4">
        <thead>
          <tr>
            <th class="text-muted mt-1 fw-bold fs-7">Institución</th>
            <th class="text-muted mt-1 fw-bold fs-7 text-center">Total</th>
          </tr>
        </thead>
        <tbody>
          @for (institution of instituciones; track trackByInstitution($index,
          institution)) {
          <tr>
            <td>
              <div class="d-flex align-items-center">
                <div
                  class="symbol symbol-45px me-5 d-flex justify-content-center align-items-center px-2"
                >
                  <mat-icon
                    style="
                      font-size: 25px;
                      height: 25px;
                      width: 40px;
                      color: rgb(1, 8, 49);
                    "
                    >business</mat-icon
                  >
                </div>
                <div class="d-flex justify-content-start flex-column">
                  <span class="text-gray-900 fw-bolder fs-6">
                    {{ $index + 1 }}.
                    {{ institution.institucion_nombre| titlecase }}
                  </span>
                </div>
              </div>
            </td>
            <td class="text-end" style="min-width: 120px">
              <span
                class="bg-light-primary rounded py-1 px-2 fw-bold text-primary"
              >
                {{ institution.total }}
                <span translate="GRAPHICS.TITLES.REQUEST"></span>
              </span>
            </td>
          </tr>
          } @empty {
          <tr>
            <td colspan="2" class="text-center text-muted">
              <span translate="No se encontraron instituciones"></span>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
