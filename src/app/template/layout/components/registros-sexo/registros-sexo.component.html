<div>
    <div class="card-header border-0 pt-5">
        <h3 class="card-title align-items-start flex-column">
            <span class="card-label fw-bolder fs-3 mb-1" translate="GRAPHICS.TITLES.RECORDS_GENDER"></span>
        </h3>

        <div class="card-toolbar">
            <!-- begin::Button-->
            <div class="btn btn-sm btn-icon btn-bg-light btn-active-color-primary tooltip-css">
                <mat-icon style="color: #1D6F42;">description</mat-icon>
                <span class="tooltip-text" translate="BUTTON.EXPORT_EXCEL"></span>
            </div>
            <!-- end::Button-->
        </div>
    </div>
    <!-- end::Header -->
    <!-- begin::Body -->
    <div class="card-body h-100">
                <!-- NUEVO: Estado de carga -->
        <div *ngIf="isLoading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="text-muted mt-2">Cargando datos de género...</p>
        </div>

        <!-- NUEVO: Estado de error -->
        <div *ngIf="hasError && !isLoading" class="text-center py-5">
            <div class="alert alert-danger d-inline-block">
                <p>Error al cargar los datos</p>
                <button class="btn btn-sm btn-primary mt-2" (click)="retryLoad()">
                    Reintentar
                </button>
            </div>
        </div>
                <!-- NUEVO: Estado sin datos -->
        <div *ngIf="!isLoading && !hasError && (!isChartReady || !chartOptions?.series?.length)" class="text-center py-5">
            <p class="text-muted">No hay datos disponibles</p>
        </div>
        <!-- begin::PieCharts -->
        <!-- <div #chartRef id="kt_charts_widget_1_chart"
            style="max-height:350px;">-->
            <!-- MODIFICADO: Gráfico con condiciones de visibilidad -->
             <div *ngIf="isChartReady && chartOptions?.series?.length && !isLoading && !hasError" 
             #chartRef id="kt_charts_widget_1_chart" style="max-height:350px;">
            <apx-chart 
                [series]="chartOptions?.series || []" 
                [chart]="chartOptions?.chart || { type: 'donut', height: 350 }" 
                [labels]="chartOptions?.labels || []"
                [responsive]="chartOptions?.responsive" 
                [legend]="chartOptions?.legend" 
                [plotOptions]="chartOptions?.plotOptions"
                [dataLabels]="chartOptions?.dataLabels" 
                [stroke]="chartOptions?.stroke">
                [colors]="chartOptions.colors"> <!-- NUEVO: colors agregado -->
            </apx-chart>
        </div>
        <!-- end::PieCharts -->
    </div>
</div>
