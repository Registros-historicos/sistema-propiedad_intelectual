<div class="card card-xl-stretch mb-xl-8">
  <!-- begin::Header -->
  <div class="card-header border-0 pt-5">
    <h3 class="card-title align-items-start flex-column">
      <span
        class="card-label fw-bolder fs-3 mb-1"
        translate="GRAPHICS.TITLES.INSTITUTIONS"
      ></span>
      <span
        class="text-muted mt-1 fw-bold fs-7"
        translate="GRAPHICS.SUBTITLES.TOP_5"
      ></span>
    </h3>
    <div class="card-toolbar">
      <!-- begin::Button-->
      <div
        class="btn btn-sm btn-icon btn-bg-light btn-active-color-primary tooltip-css"
      >
        <mat-icon style="color: #1d6f42">description</mat-icon>
        <span class="tooltip-text" translate="BUTTON.EXPORT_EXCEL"></span>
      </div>
      <!-- end::Button-->
    </div>
  </div>
  <!-- end::Header -->
  <!-- begin::Body -->
  <div class="card-body py-3">
    
    <!-- DEBUG TEMPORAL 
    <div class="alert alert-success mb-3" *ngIf="instituciones.length > 0">
      <strong>✅ INSTITUCIONES CARGADAS:</strong> {{ instituciones.length }} instituciones
    </div>-->
    
    <!-- begin::Table container -->
    <div class="table-responsive" style="max-height: 400px; overflow-y: auto">
      <!-- begin::Table -->
      <table class="table align-middle gs-0 gy-4"> <!-- Reducido solo el espacio vertical entre filas -->
        <!-- begin::Table head -->
        <thead>
          <tr>
            <th class="text-muted mt-1 fw-bold fs-7">Institución</th> <!-- Aumentado el ancho para las instituciones -->
            <th class="text-muted mt-1 fw-bold fs-7 text-center">Total </th> <!-- Reducido el ancho para el total -->
          </tr>
        </thead>
        <!-- end::Table head -->
        <!-- begin::Table body -->
        <tbody>
          @for (institution of instituciones; track trackByInstitution($index, institution)) {
          <tr>
            <td>
              <div class="d-flex align-items-center">
                <div class="symbol symbol-45px me-5 d-flex justify-content-center align-items-center px-2">
                  <mat-icon
                    style="
                      font-size: 25px;
                      height: 25px;
                      width: 40px;
                      color: rgb(1, 8, 49);
                    "
                    >business</mat-icon>
                </div>
                <div class="d-flex justify-content-start flex-column">
                  <span class="text-gray-900 fw-bolder fs-6">
                    {{ $index + 1 }} . {{ institution.institucion_nombre | titlecase }}
                  </span>
                </div>
              </div>
            </td>
            <td class="text-end" style="min-width: 120px;">
            <span class="bg-light-primary rounded py-1 px-2 fw-bold text-primary">
              {{ institution.total }} <span translate="GRAPHICS.TITLES.REQUEST"></span>
            </span>
            </td>
          </tr>
          } @empty {
          <tr>
            <td colspan="2" class="text-center text-muted">
              <span translate="No se encontraron instituciones"></span>
            </td>
          </tr>
          }
        </tbody>
        <!-- end::Table body -->
      </table>
      <!-- end::Table -->
    </div>
    <!-- end::Table container -->
  </div>
  <!-- end::Body -->
</div>
