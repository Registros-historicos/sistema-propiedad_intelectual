<div class="card card-xl-stretch mb-xl-8">
  <!-- begin::Header -->
  <div class="card-header border-0 pt-5">
    <h3 class="card-title align-items-start flex-column">
      <span
        class="card-label fw-bolder fs-3 mb-1"
        translate="GRAPHICS.TITLES.INSTITUTIONS"
      ></span>
      <span
        class="text-muted mt-1 fw-bold fs-7"
        translate="GRAPHICS.SUBTITLES.TOP_5"
      ></span>
    </h3>
    <div class="card-toolbar">
      <!-- begin::Button-->
      <div
        class="btn btn-sm btn-icon btn-bg-light btn-active-color-primary tooltip-css"
      >
        <mat-icon style="color: #1d6f42">description</mat-icon>
        <span class="tooltip-text" translate="BUTTON.EXPORT_EXCEL"></span>
      </div>
      <!-- end::Button-->
    </div>
  </div>
  <!-- end::Header -->
  <!-- begin::Body -->
  <div class="card-body py-3">
    <!-- begin::Table container -->
    <div class="table-responsive" style="max-height: 400px; overflow-y: auto">
      <!-- begin::Table -->
      <table class="table align-middle gs-0 gy-5">
        <!-- begin::Table head -->
        <thead>
          <tr>
            <th class="p-0 min-w-150px"></th>
            <th class="p-0 min-w-200px"></th>
            <th class="p-0 min-w-125px"></th>
          </tr>
        </thead>
        <!-- end::Table head -->
        <!-- begin::Table body -->
        <tbody>
          @for (institution of topFiveFederalInstitutions; track $index) {
          <tr>
            <td>
              <div class="d-flex align-items-center">
                <div class="symbol symbol-45px me-5">
                  <app-keenicon name="institution" class="fs-2"></app-keenicon>
                </div>
                <div class="d-flex justify-content-start flex-column">
                  <span class="text-gray-900 fw-bolder fs-6"
                    >{{ $index + 1 }} . {{ institution.name | titlecase }}</span
                  >
                </div>
              </div>
            </td>
            <td class="text-end">
              @for (tag of institution.tags; track $index) {
              <span
                class="badge fw-bold me-1"
                [ngClass]="{
                  'badge-light-danger': tag === 'PATENTS',
                  'badge-light-info': tag === 'MA',
                  'badge-light-warning': tag === 'MU',
                  'badge-light-success': tag === 'DA',
                  'badge-light-primary': tag === 'DI'
                }"
              >
                {{ tag }}
              </span>
              }
            </td>
            <td class="text-center">
              <span class="text-muted fw-bold"
                >{{ institution.value }}
                <span translate="GRAPHICS.TITLES.REQUEST"></span
              ></span>
            </td>
          </tr>
          } @empty {
          <tr>
            <td colspan="2" class="text-center text-muted">
              <span translate="GRAPHICS.LEGENDS.NO_FEDERAL_INSTITUTIONS"></span>
            </td>
          </tr>
          }
        </tbody>
        <!-- end::Table body -->
      </table>
      <!-- end::Table -->
    </div>
    <!-- end::Table container -->
  </div>
  <!-- end::Body -->
</div>
