<div class="card card-xl-stretch mb-xl-8">
  <div class="card-header border-0 pt-5">
    <h3 class="card-title align-items-start flex-column">
      <span class="card-label fw-bolder fs-3 mb-1">
        {{ titulo }}
      </span>
      <span class="text-muted mt-1 fw-bold fs-7">
        {{ totalInstitutes }} institutos
      </span>
    </h3>
    <div class="card-toolbar">
      <!-- begin::Button-->
      <div
        class="btn btn-sm btn-icon btn-bg-light btn-active-color-primary tooltip-css"
      >
        <mat-icon style="color: #1d6f42">description</mat-icon>
        <span class="tooltip-text" translate="BUTTON.EXPORT_EXCEL"></span>
      </div>
      <!-- end::Button-->
    </div>
  </div>
  <div class="card-body">
    <!-- Loading State -->
    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="text-muted mt-2">Cargando datos...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="error && !loading" class="text-center py-5">
      <div class="alert alert-danger">
        <p>{{ errorMessage }}</p>
        <button class="btn btn-sm btn-primary" (click)="retryLoad()">
          Reintentar
        </button>
      </div>
    </div>

    <!-- Data Table -->
    <div
      *ngIf="!loading && !error"
      class="table-responsive"
      style="max-height: 400px; overflow-y: auto"
    >
      <table class="table align-middle gs-0 gy-5">
        <thead></thead>
        <tbody>
          <tr *ngFor="let institute of data; trackBy: trackByInstitutionId">
            <td>
              <div class="d-flex align-items-center">
                <div
                  class="symbol symbol-45px me-5 d-flex justify-content-center align-items-center px-2"
                >
                  <mat-icon
                    style="
                      font-size: 25px;
                      height: 25px;
                      width: 40px;
                      color: rgb(1, 8, 49);
                    "
                    >business</mat-icon
                  >
                </div>
                <div class="d-flex justify-content-start flex-column">
                  <h4 class="text-gray-900 fw-bolder fs-6 mb-1">
                    {{ institute.institucion_nombre }}
                  </h4>
                  <span class="text-muted fw-bold fs-7">
                    {{ institute.tipo_institucion }}
                  </span>
                </div>
              </div>
            </td>
            <td class="text-end">
              <span class="badge badge-light-primary fw-bold fs-7">
                {{ institute.total }} registros
              </span>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Empty State -->
      <div
        *ngIf="data.length === 0 && !loading && !error"
        class="text-center py-5"
      >
        <p class="text-muted">No se encontraron instituciones</p>
      </div>
    </div>
  </div>
</div>
