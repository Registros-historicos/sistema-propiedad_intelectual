<div class="card card-xl-stretch mb-xl-8">
  <div class="card-header border-0 pt-5">
    <h3 class="card-title align-items-start flex-column">
      <span class="card-label fw-bolder fs-3 mb-1" [translate]="titulo"></span>
      <span
        *ngIf="subtitulo"
        class="text-muted mt-1 fw-bold fs-7"
        [translate]="subtitulo"
      ></span>
    </h3>
    <div class="card-toolbar">
      <!-- begin::Button-->
      <div
        class="btn btn-sm btn-icon btn-bg-light btn-active-color-primary tooltip-css"
        (click)="onExportExcel()"
      >
        <mat-icon style="color: #1d6f42">description</mat-icon>
        <span class="tooltip-text" translate="BUTTON.EXPORT_EXCEL"></span>
      </div>
      <!-- end::Button-->
    </div>
  </div>
  <div class="card-body p-5">
    <!-- AGREGADO desde aquí - Estado de carga -->
    <div *ngIf="!isChartReady || !data?.length" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <!--<p class="text-muted mt-2" translate="COMMON.LOADING"></p>-->
      <p class="text-muted mt-2">Cargando...</p>
    </div>
    <!-- SE MODIFICO esta línea -->
    <div class="table-responsive" *ngIf="isChartReady && data?.length">
    <!--<div class="table-responsive">-->
  <apx-chart
        [series]="chartOptions.series"
        [chart]="chartOptions.chart"
        [xaxis]="chartOptions.xaxis"
        [dataLabels]="chartOptions.dataLabels"
        [stroke]="chartOptions.stroke"
        [legend]="chartOptions.legend"
        [fill]="chartOptions.fill"
        [tooltip]="chartOptions.tooltip"
        [colors]="chartOptions.colors"
        [plotOptions]="chartOptions.plotOptions"
      ></apx-chart>
    </div>
    <!-- SE AGREGÓ desde aquí - Estado vacío -->
    <div *ngIf="isChartReady && (!data || data.length === 0)" class="text-center py-5">
      <!-- <p class="text-muted" translate="COMMON.NO_DATA"></p>-->
      <p class="text-muted">No hay datos disponibles</p>
    </div>
    <!-- HASTA aquí -->
  </div>
</div>
