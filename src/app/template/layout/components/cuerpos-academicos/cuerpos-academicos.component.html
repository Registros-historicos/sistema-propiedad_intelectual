<div>
    <div class="card-header border-0 pt-5">
        <h3 class="card-title align-items-start flex-column">
            <span class="card-label fw-bolder fs-3 mb-1" translate="GRAPHICS.TITLES.RESEARCH_GROUPS"></span>
        </h3>

        <div class="card-toolbar">
            <div class="btn btn-sm btn-icon btn-bg-light btn-active-color-primary tooltip-css">
                <mat-icon style="color: #1D6F42;">description</mat-icon>
                <span class="tooltip-text" translate="BUTTON.EXPORT_EXCEL"></span>
            </div>
        </div>
    </div>
    <div class="card-body py-3">
        <div class="table-responsive" style="max-height: 400px; overflow-y: auto">
            <table class="table align-middle gs-0 gy-5">
                <thead>
                    <tr>
                        <th class="p-0 min-w-150px"></th>
                        <th class="p-0 min-w-150px"></th>
                    </tr>
                </thead>
                <tbody>
                    <ng-container *ngFor="let ca of cuerposAcademicos">
                        <tr>
                            <td>
                                <span class="text-gray-900 fw-bold mb-1 fs-5">{{ca.nombre}}</span>
                            </td>
                            <td class="text-end">
                                <span class="badge badge-light-primary fw-bold fs-7">{{ca.solicitudes}} Solicitudes</span>
                            </td>
                        </tr>
                    </ng-container>
                </tbody>
            </table>
        </div>
    </div>
</div>
