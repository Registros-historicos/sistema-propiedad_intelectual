<div>
    <div class="card-header border-0 pt-5">
        <h3 class="card-title align-items-start flex-column">
            <span class="card-label fw-bolder fs-3 mb-1" translate="GRAPHICS.TITLES.RECORDS_YEAR"></span>
            <div class="btn-group mt-1 position-relative" [class.compact]="compactYearButton">
                <button class="btn btn-sm btn-outline-secondary" type="button" (click)="toggleYearMenu()">
                    {{ year || '2025' }}
                </button>
                <div class="dropdown-menu show" *ngIf="showYearMenu" style="position: absolute; transform: translateY(6px); z-index: 1050;">
                    <button class="dropdown-item" *ngFor="let y of yearOptions" [class.active]="y === year" (click)="selectYear(y, $event)">{{ y }}</button>
                </div>
            </div>
        </h3>
        <div class="card-toolbar">
            <button type="button" class="btn btn-sm btn-icon btn-bg-light btn-active-light-primary me-5"
                data-kt-menu-trigger="click" data-kt-menu-placement="bottom-end" data-kt-menu-flip="top-end">
                <mat-icon class="fs-2">filter_list</mat-icon>
            </button>
            <div class="menu menu-sub menu-sub-dropdown w-250px w-md-300px" data-kt-menu="true">
                <div class="px-7 py-5">
                    <div class="fs-5 text-gray-900 fw-bolder">Filtros:</div>
                </div>

                <div class="separator border-gray-200"></div>

                <div class="px-7 py-5">
                    <div class="mb-10">
                        <label class="form-label fw-bold">Trimestres:</label>

                        <div>
                            <select class="form-select form-select-solid"
                                [(ngModel)]="selectedQuarter"
                                (change)="applyQuarterFilter($event)">
                                <option value="">Ninguno</option>
                                <option value="Ene-Mar">Ene - Mar</option>
                                <option value="Abr-Jun">Abr - Jun</option>
                                <option value="Jul-Sep">Jul - Sep</option>
                                <option value="Oct-Dic">Oct - Dic</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-10">
                        <label class="form-label fw-bold">Rango de fecha:</label>
                        <div class="d-flex flex-column align-items-start position-relative my-1">
                            <span>Fecha inicio:</span>
                            <input type="date" class="form-control form-control-solid w-250px ps-12" [disabled]="selectedQuarter !== null && selectedQuarter !== ''"
                                (change)="applyDateRange($event, endDate)" [(ngModel)]="startDate" />
                            <span class="mt-3">Fecha fin:</span>
                            <input type="date" class="form-control form-control-solid w-250px ps-12" [disabled]="selectedQuarter !== null && selectedQuarter !== ''"
                                (change)="applyDateRange(startDate, $event)" [(ngModel)]="endDate" />
                        </div>
                    </div>
                </div>

            </div>
            <div class="btn btn-sm btn-icon btn-bg-light btn-active-color-primary tooltip-css">
                <mat-icon style="color: #1D6F42;">description</mat-icon>
                <span class="tooltip-text" translate="BUTTON.EXPORT_EXCEL"></span>
            </div>
        </div>
    </div>
    <div class="card-body p-5">
        <!-- Indicador de carga para peticiones por periodo -->
        <div *ngIf="loadingPeriod" class="mb-3">
            <span class="badge bg-info">Cargando datos del periodo...</span>
        </div>
        <div class="table-responsive" style="min-height:400px;">
            <apx-chart [series]="chartOptions.series" [chart]="chartOptions.chart" [xaxis]="chartOptions.xaxis"
                [dataLabels]="chartOptions.dataLabels" [stroke]="chartOptions.stroke" [legend]="chartOptions.legend"
                [fill]="chartOptions.fill" [tooltip]="chartOptions.tooltip" [colors]="chartOptions.colors"
                [plotOptions]="chartOptions.plotOptions"></apx-chart>
        </div>
    </div>
</div>
