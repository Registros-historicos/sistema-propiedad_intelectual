<div class="card card-xl-stretch mb-xl-8">
  <div class="card-header border-0 pt-5">
    <h3 class="card-title align-items-start flex-column">
      <span class="card-label fw-bolder fs-3 mb-1" translate="GRAPHICS.TITLES.RECORDS_STATUS"></span>
      <span class="text-muted fw-bold fs-7" translate="GRAPHICS.TITLES.TYPE"></span>
    </h3>

    <div class="card-toolbar">
      <button
        type="button"
        class="btn btn-sm btn-icon btn-color-primary btn-active-light-primary"
        data-kt-menu-trigger="click"
        data-kt-menu-placement="bottom-end"
        data-kt-menu-flip="top-end"
      >
        <span class="fs-2">
          <div class="btn btn-sm btn-icon btn-bg-light btn-active-color-primary tooltip-css">
            <mat-icon style="color: #1D6F42;">description</mat-icon>
            <span class="tooltip-text" translate="BUTTON.EXPORT_EXCEL"></span>
          </div>
        </span>
      </button>
    </div>
  </div>

  <div class="card-body">
    <!-- Igual que el ejemplo: alto por estilo inline del contenedor -->
    <div #chartRef id="records_status_chart" [style.height]="'350px'">
      <apx-chart
        *ngIf="chartOptions?.series?.length"
        [series]="chartOptions.series"
        [chart]="chartOptions.chart"
        [labels]="chartOptions.labels"
        [dataLabels]="chartOptions.dataLabels"
        [legend]="chartOptions.legend"
        [stroke]="chartOptions.stroke"
        [plotOptions]="chartOptions.plotOptions"
        [tooltip]="chartOptions.tooltip"
        [states]="chartOptions.states"
        [colors]="chartOptions.colors"
      ></apx-chart>
    </div>
  </div>
</div>
