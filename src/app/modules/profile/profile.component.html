<!-- Solo renderizar cuando ya exista userProfile -->
<div *ngIf="userProfile as user">
  <div class="card mb-5 mb-xxl-8">
    <div class="card-body pt-9 pb-0">
      <div class="d-flex flex-wrap flex-sm-nowrap mb-3">
        <div class="me-7 mb-4">
          <div class="symbol symbol-100px symbol-lg-160px symbol-fixed position-relative">
            <!-- Fallback de imagen por si no viene pic -->
            <img [src]="user.pic || './assets/media/avatars/300-1.jpg'" alt="image" />
            <div
              class="position-absolute translate-middle bottom-0 start-100 mb-6 bg-success rounded-circle border border-4 border-white h-20px w-20px">
            </div>
          </div>
        </div>

        <div class="flex-grow-1">
          <div class="d-flex justify-content-between align-items-start flex-wrap mb-2">
            <div class="d-flex flex-column">
              <div class="d-flex align-items-center mb-2">
                <a href="#" class="text-gray-900 text-hover-primary fs-2 fw-bolder me-1">
                  {{ user.fullname || user.username }}
                </a>
                <a href="#" class="btn btn-sm btn-icon btn-light btn-active-light-primary">
                  <app-keenicon name="pencil" class="fs-3"></app-keenicon>
                </a>
              </div>

              <!-- Info básica -->
              <div class="d-flex flex-wrap fw-bold fs-6 mb-4 pe-2">
                <a href="#" class="d-flex align-items-center text-gray-500 text-hover-primary me-5 mb-2">
                  <app-keenicon name="profile-circle" class="fs-4 me-1"></app-keenicon>
                  {{ user.occupation }}
                </a>

                <a href="#" class="d-flex align-items-center text-gray-500 text-hover-primary me-5 mb-2">
                  <app-keenicon name="geolocation" class="fs-4 me-1"></app-keenicon>
                  {{ user.address?.city || 'No especificada' }},
                  {{ user.address?.state || 'No especificado' }}
                </a>

                <a href="#" class="d-flex align-items-center text-gray-500 text-hover-primary mb-2">
                  <app-keenicon name="sms" class="fs-4 me-1"></app-keenicon>
                  {{ user.email }}
                </a>
              </div>

              <div class="d-flex flex-wrap flex-stack">
                <div class="d-flex flex-column flex-grow-1 pe-8">
                  <div class="d-flex flex-wrap">

                    <!-- Roles activos -->
                    <div
                      class="border border-gray-300 border-dashed rounded min-w-125px py-3 px-4 me-6 mb-3">
                      <div class="d-flex align-items-center">
                        <div class="fs-2 fw-bolder">{{ (user.roles || []).length }}</div>
                      </div>
                      <div class="fw-bold fs-6 text-gray-500">Roles activos</div>
                    </div>

                    <!-- Idioma -->
                    <div
                      class="border border-gray-300 border-dashed rounded min-w-125px py-3 px-4 me-6 mb-3">
                      <div class="d-flex align-items-center">
                        <div class="fs-2 fw-bolder">
                          {{ (user.language || 'es')?.toUpperCase() }}
                        </div>
                      </div>
                      <div class="fw-bold fs-6 text-gray-500">Idioma</div>
                    </div>

                  </div>
                </div>
              </div>

            </div>
          </div>

          <!-- Tabs -->
          <div class="d-flex overflow-auto h-55px">
            <ul
              class="nav nav-stretch nav-line-tabs nav-line-tabs-2x border-transparent fs-5 fw-bolder flex-nowrap">
              <li class="nav-item">
                <a class="nav-link text-active-primary me-6 active">
                  Información General
                </a>
              </li>
            </ul>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Aquí dentro ya puedes seguir con más contenido del perfil si lo hubiera -->
</div>

<router-outlet></router-outlet>
