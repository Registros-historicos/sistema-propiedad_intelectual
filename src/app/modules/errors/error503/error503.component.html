<div class="not-available-container">
  <div class="icon-wrapper">
    <mat-icon class="unavailable-icon">error</mat-icon>
  </div>

  <h1 class="title">
    {{ 'ERROR.NOTAVAILABLE.TITLE' | translate }}
  </h1>

  <p class="description">
    {{ 'ERROR.NOTAVAILABLE.DESCRIPTION' | translate }}

  <div class="action-button">

      {{ 'ERROR.NOTAVAILABLE.BACK_TO_HOME' | translate }}
