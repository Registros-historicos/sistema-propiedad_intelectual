<div class="card">
  <div class="card-header border-0 pt-6">
    <!--begin::Card title-->
    <div class="card-title">
      <!--begin::Search-->
      <div class="d-flex align-items-center position-relative my-1">
        <app-keenicon name="magnifier" class="fs-3 position-absolute ms-5"></app-keenicon>
        <input type="text" data-action="filter" class="form-control form-control-solid w-250px ps-12" [placeholder]="placeholder">
      </div>
      <!--end::Search-->
    </div>
    <!--begin::Card title-->

    <!--begin::Card toolbar-->
    <div class="card-toolbar">
      <!--begin::Toolbar-->
      <div class="d-flex justify-content-end align-items-center">
        <div class="d-flex align-items-center me-4">
          <label class="form-label text-gray-600 me-3 mb-0 fw-semibold" translate="TABLE.PAGE_LENGTH.LABEL"></label>
          <select class="form-select form-select-sm form-select-solid w-auto" (change)="onPageLengthChange($event)"
                  [(ngModel)]="pageLength">
            <option *ngFor="let length of lengthMenu" [value]="length">{{length}}</option>
          </select>
          <span class="text-gray-600 ms-2 fw-semibold" translate="TABLE.PAGE_LENGTH.RECORDS"></span>
        </div>
      </div>
      <!--end::Toolbar-->
    </div>
    <!--end::Card toolbar-->
  </div>

  <div class="card-body pt-0">
    <app-crud
      [datatableConfig]="datatableConfig"
      route="/apps/applicants"
      (deleteEvent)="delete($event)"
      (editEvent)="navigateToEdit($event, editModal)"
      [reload]="reloadEvent">
    </app-crud>
  </div>
</div>

<!-- SweetAlert2 para notificaciones -->
<swal #noticeSwal [swalOptions]="swalOptions"></swal>

<!-- Modal de edición -->
<ng-template #editModal let-modal>
  <div class="modal-header">
    <h3 class="modal-title fw-bold text-gray-800">
      Editar Solicitante
    </h3>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
  </div>

  <div class="modal-body py-6 px-8">
    <div class="d-flex flex-column" *ngIf="selectedApplicant">
      <!-- Notificación informativa -->
      <div class="notice d-flex bg-light-primary rounded border-primary border border-dashed mb-7 p-6">
        <app-keenicon name="information-5" class="fs-2 text-primary me-4"></app-keenicon>
        <div class="d-flex flex-column">
          <h4 class="text-gray-900 fw-bold mb-2">Información del Solicitante</h4>
          <span class="text-gray-700">Revise y modifique la información del solicitante según sea necesario.</span>
        </div>
      </div>

      <!-- Formulario en dos columnas -->
      <div class="row g-6 mb-6">
        <!-- Columna izquierda -->
        <div class="col-md-6">
          <div class="fv-row mb-6">
            <label class="fs-6 fw-semibold mb-2 required">Nombre</label>
            <input type="text" class="form-control form-control-solid" [(ngModel)]="selectedApplicant.nombre" name="nombre">
          </div>

          <div class="fv-row mb-6">
            <label class="fs-6 fw-semibold mb-2 required">Email</label>
            <input type="email" class="form-control form-control-solid" [(ngModel)]="selectedApplicant.email" name="email">
          </div>

          <div class="fv-row mb-6">
            <label class="fs-6 fw-semibold mb-2">Entidad Federativa</label>
            <select class="form-select form-select-solid" [(ngModel)]="selectedApplicant.entidad_federativa" name="entidad_federativa">
              <option value="">Seleccionar entidad federativa</option>
              <option *ngFor="let entidad of entidadesFederativas" [value]="entidad">{{entidad}}</option>
            </select>
          </div>

          <div class="fv-row mb-6">
            <label class="fs-6 fw-semibold mb-2">Sexo</label>
            <select class="form-select form-select-solid" [(ngModel)]="selectedApplicant.sexo" name="sexo">
              <option value="">Seleccionar sexo</option>
              <option *ngFor="let sexo of sexoOptions" [value]="sexo">{{sexo}}</option>
            </select>
          </div>

          <div class="fv-row mb-6">
            <label class="fs-6 fw-semibold mb-2">RFC</label>
            <input type="text" class="form-control form-control-solid" [(ngModel)]="selectedApplicant.rfc" name="rfc">
          </div>

          <div class="fv-row mb-6">
            <label class="fs-6 fw-semibold mb-2">Departamento</label>
            <select class="form-select form-select-solid" [(ngModel)]="selectedApplicant.departamento" name="departamento" (change)="onDepartamentoChange()">
              <option value="">Seleccionar departamento</option>
              <option *ngFor="let dept of departamentos" [value]="dept">{{dept}}</option>
            </select>
          </div>
        </div>

        <!-- Columna derecha -->
        <div class="col-md-6">
          <div class="fv-row mb-6">
            <label class="fs-6 fw-semibold mb-2 required">Apellidos</label>
            <input type="text" class="form-control form-control-solid" [(ngModel)]="selectedApplicant.apellidos" name="apellidos">
          </div>

          <div class="fv-row mb-6">
            <label class="fs-6 fw-semibold mb-2">Teléfono</label>
            <input type="tel" class="form-control form-control-solid" [(ngModel)]="selectedApplicant.telefono" name="telefono">
          </div>

          <div class="fv-row mb-6">
            <label class="fs-6 fw-semibold mb-2">Institución</label>
            <input type="text" class="form-control form-control-solid" [(ngModel)]="selectedApplicant.institucion_adscripcion" name="institucion_adscripcion">
          </div>

          <div class="fv-row mb-6">
            <label class="fs-6 fw-semibold mb-2">Edad</label>
            <input type="number" class="form-control form-control-solid" [(ngModel)]="selectedApplicant.edad" name="edad">
          </div>

          <div class="fv-row mb-6">
            <label class="fs-6 fw-semibold mb-2">CURP</label>
            <input type="text" class="form-control form-control-solid" [(ngModel)]="selectedApplicant.curp" name="curp">
          </div>

          <div class="fv-row mb-6">
            <label class="fs-6 fw-semibold mb-2">Programa Educativo</label>
            <select class="form-select form-select-solid" [(ngModel)]="selectedApplicant.programa_educativo" name="programa_educativo">
              <option value="">Seleccionar programa educativo</option>
              <option *ngFor="let programa of programasEducativosFiltrados" [value]="programa.nombre">{{programa.nombre}}</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-footer border-0 px-8 py-5">
    <button type="button" class="btn btn-light me-3" (click)="modal.dismiss()">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="modal.close()">
      <span class="indicator-label">Guardar</span>
    </button>
  </div>
</ng-template>
