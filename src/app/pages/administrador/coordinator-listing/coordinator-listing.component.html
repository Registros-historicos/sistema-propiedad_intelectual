<div class="card">
  <div class="card-header border-0 pt-6">
    <!--begin::Card title-->
    <div class="card-title">
      <!--begin::Search-->
      <div class="d-flex align-items-center position-relative my-1">
        <app-keenicon name="magnifier" class="fs-3 position-absolute ms-5"></app-keenicon>
        <input type="text" data-action="filter" class="form-control form-control-solid w-250px ps-12" placeholder="Buscar Coordinadores">
      </div>
      <!--end::Search-->
    </div>
    <!--begin::Card title-->

    <!--begin::Card toolbar-->
    <div class="card-toolbar">
      <!--begin::Toolbar-->
      <div class="d-flex justify-content-end">
        <!--begin::Pagination selector-->
        <div class="d-flex align-items-center">
          <label class="form-label text-gray-600 me-3 mb-0">Mostrar:</label>
          <select class="form-select form-select-sm form-select-solid w-75px"
                  (change)="onPageLengthChange($event)"
                  [(ngModel)]="pageLength">
            <option *ngFor="let length of lengthMenu" [value]="length">{{length}}</option>
          </select>
        </div>
        <!--end::Pagination selector-->

      </div>
      <!--end::Toolbar-->
    </div>
    <!--end::Card toolbar-->
  </div>

  <div class="card-body pt-0">
    <!-- En coordinator-listing.component.html -->
    <app-crud [datatableConfig]="datatableConfig" route="/administrador/coordinadores" (deleteEvent)="delete($event)" (editEvent)="navigateToEdit($event)" [reload]="reloadEvent"></app-crud>
  </div>
</div>

<swal #noticeSwal [swalOptions]="swalOptions">
</swal>
