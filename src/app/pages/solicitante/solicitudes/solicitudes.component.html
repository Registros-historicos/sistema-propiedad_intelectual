<!-- Mis Solicitudes -->
<div class="card">
  <!-- Header -->

  <div class="card-header border-0 pt-5">
    <div class="card-title">
      <!--begin::Search-->
      <div class="d-flex flex-column align-items-start w-100">
        <div class="card-title mb-3">
          <span class="card-label fw-bolder fs-3">Mis Solicitudes</span>
        </div>
        <div class="d-flex align-items-center position-relative w-100">
          <app-keenicon
            name="magnifier"
            class="fs-3 position-absolute ms-5"
          ></app-keenicon>
          <input
            type="text"
            data-action="filter"
            class="form-control form-control-solid w-100 ps-12"
            placeholder="Buscar solicitud"
          />
        </div>
      </div>
      <!--end::Search-->
    </div>

    <!-- Paginador: Selector de cantidad por página -->
    <div class="card-toolbar">
      <div class="d-flex align-items-center">
        <label class="form-label text-gray-600 me-3 mb-0">Mostrar:</label>
        <select
          class="form-select form-select-sm form-select-solid w-75px"
          [(ngModel)]="pageLength"
          (change)="onPageLengthChange($event)"
        >
          <option *ngFor="let length of lengthMenu" [value]="length">
            {{ length }}
          </option>
        </select>
      </div>
    </div>
  </div>

  <!-- Body -->
  <div class="card-body pt-0">
    <app-crud
      [datatableConfig]="datatableConfig"
      route="/apps/solicitudes"
      (deleteEvent)="delete($event)"
      (viewEvent)="view($event)"
      [reload]="reloadEvent"
      [modal]="formModal"
    >
    </app-crud>

    <swal #noticeSwal [swalOptions]="swalOptions"></swal>
  </div>

  <!-- Modal -->
  <ng-template #formModal let-modal>
    <div class="modal-header">
      <h3 class="modal-title">Detalles de la Solicitud</h3>
      <button
        type="button"
        class="btn-close"
        aria-label="Close"
        (click)="modal.dismiss('Cross click')"
      ></button>
    </div>

    <div class="modal-body">
      <div class="d-flex flex-column scroll-y me-n7 pe-7 mw-650px">
        <div
          class="notice d-flex bg-light-info rounded border-info border border-dashed mb-7 p-6"
        >
          <app-keenicon
            name="information-5"
            class="fs-2tx text-info me-4"
          ></app-keenicon>
          <div class="d-flex flex-stack flex-grow-1">
            <div class="fw-semibold">
              <h4 class="text-gray-900 fw-bold">Información de la Solicitud</h4>
              <div class="fs-6 text-gray-700">
                Aquí puedes ver los detalles de la solicitud seleccionada.
              </div>
            </div>
          </div>
        </div>

        <div class="fv-row mb-7">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Título</label>
          <textarea
            type="text"
            class="form-control form-control-solid bg-light"
            [value]="solicitudSeleccionada?.titulo"
            readonly
            style="resize: none; overflow: hidden"
            rows="auto"
          ></textarea>
        </div>

        <div class="row g-9 mb-7">
          <div class="fv-row col-md-6">
            <label class="fw-semibold fs-6 mb-2 text-gray-600"
              >Solicitante</label
            >
            <input
              type="text"
              class="form-control form-control-solid bg-light"
              [value]="solicitudSeleccionada?.solicitante"
              readonly
            />
          </div>

          <div class="fv-row col-md-6">
            <label class="fw-semibold fs-6 mb-2 text-gray-600">Correo</label>
            <input
              type="email"
              class="form-control form-control-solid bg-light"
              [value]="solicitudSeleccionada?.correo"
              readonly
            />
          </div>
        </div>

        <div class="row g-9 mb-7">
          <div class="fv-row col-md-6">
            <label class="fw-semibold fs-6 mb-2 text-gray-600"
              >Fecha de Solicitud</label
            >
            <input
              type="text"
              class="form-control form-control-solid bg-light"
              [value]="solicitudSeleccionada?.fechaSolicitud"
              readonly
            />
          </div>

          <div class="fv-row col-md-6">
            <label class="fw-semibold fs-6 mb-2 text-gray-600">Estado</label>
            <div
              class="form-control form-control-solid d-flex align-items-center"
            >
              <span
                class="badge"
                [ngClass]="{
                  'badge-light-success':
                    solicitudSeleccionada?.estado === 'Aprobada',
                  'badge-light-primary':
                    solicitudSeleccionada?.estado === 'Registrada',
                  'badge-light-warning':
                    solicitudSeleccionada?.estado === 'En trámite',
                  'badge-light-danger':
                    solicitudSeleccionada?.estado ===
                    'Trámite con observaciones',
                  'badge-light-info':
                    solicitudSeleccionada?.estado === 'Concluida'
                }"
                class="fs-7 fw-bold"
              >
                {{ solicitudSeleccionada?.estado }}
              </span>
            </div>
          </div>
        </div>

        <div class="fv-row mb-7">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Descripción</label>
          <textarea
            class="form-control form-control-solid bg-light"
            [value]="solicitudSeleccionada?.descripcion"
            rows="3"
            readonly
          ></textarea>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button
        type="button"
        class="btn btn-primary"
        (click)="modal.dismiss('Close click')"
      >
        Cerrar
      </button>
    </div>
  </ng-template>
</div>
