<div class="card mb-5 mb-xl-10" [ngClass]="itemClass">
  <div *ngIf="user$ | async as user" class="card-body pt-9 pb-0">
    <div class="d-flex flex-wrap flex-sm-nowrap mb-3">
      <div class="me-7 mb-4">
        <div
          class="symbol symbol-100px symbol-lg-160px symbol-fixed position-relative"
        >
          <img [src]="user.pic" alt="{{ user.fullname }}" />
        </div>
      </div>

      <div class="flex-grow-1">
        <div
          class="d-flex justify-content-between align-items-start flex-wrap mb-2"
        >
          <div class="d-flex flex-column">
            <div class="d-flex align-items-center mb-2">
              <span
                class="text-gray-800 text-hover-primary fs-2 fw-bolder me-1"
              >
                {{ user.fullname }} {{ user.lastname }}
              </span>
            </div>
            <div class="text-muted fs-6">
              <p class="d-block">Correo: {{ user.email }}</p>
              <p class="d-block">Teléfono: {{ user.phone }}</p>
              <p class="d-block">Ocupación: {{ user.occupation }}</p>
              <p class="d-block">Institución: {{ user.companyName }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
