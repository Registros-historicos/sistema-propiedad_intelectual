<div class="card">
  <div class="card-header border-0 pt-6">
    <div class="card-title">
      <div class="d-flex align-items-center position-relative my-1">
        <app-keenicon name="magnifier" class="fs-3 position-absolute ms-5"></app-keenicon>
        <input type="text" data-action="filter" class="form-control form-control-solid w-250px ps-12"
          [placeholder]="placeholder" (keyup)="onFilter($event)">
      </div>
    </div>

    <div class="card-toolbar">
      <div class="d-flex justify-content-end align-items-center">
        <div class="d-flex align-items-center me-4">
          <label class="form-label text-gray-600 me-3 mb-0 fw-semibold" translate="TABLE.PAGE_LENGTH.LABEL"></label>
          <select class="form-select form-select-sm form-select-solid w-auto" (change)="onPageLengthChange($event)"
            [(ngModel)]="pageLength">
            <option *ngFor="let length of lengthMenu" [value]="length">{{ length }}</option>
          </select>
          <span class="text-gray-600 ms-2 fw-semibold" translate="TABLE.PAGE_LENGTH.RECORDS"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="card-body pt-0">
    <app-crud [datatableConfig]="datatableConfig" route="/coordinador/propiedades/modelo-utilidad"
      (deleteEvent)="delete($event)" (editEvent)="edit($event)" (viewEvent)="view($event)" [reload]="reloadEvent"
      (modalDismissedEvent)="onModalDismissed()" [modal]="isViewMode ? formModal : formModalEdit">
    </app-crud>
  </div>
</div>

<swal #noticeSwal [swalOptions]="swalOptions"></swal>

<!-- ===================== MODAL VER ====================== -->
<ng-template #formModal let-modal>
  <div class="modal-header">
    <h3 class="modal-title">
      <span translate="MODAL.TITLE"></span>
    </h3>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
  </div>

  <div class="modal-body">
    <div class="d-flex flex-column scroll-y me-n7 pe-7 mw-700px">

      <div class="notice d-flex bg-light-info rounded border-info border border-dashed mb-7 p-6">
        <app-keenicon name="information-5" class="fs-2tx text-info me-4"></app-keenicon>
        <div class="d-flex flex-stack flex-grow-1">
          <div class="fw-semibold">
            <h4 class="text-gray-900 fw-bold" translate="MODAL.INFO.TITLE"></h4>
            <div class="fs-6 text-gray-700">
              <span translate="MODAL.INFO.BODY"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- N. Expediente | N. de Título -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">N. Expediente</label>
          <input type="text" class="form-control form-control-solid bg-light" disabled [value]="indautorModel.numeroExpediente"
            readonly />
        </div>

        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">N. de Título</label>
          <input type="text" class="form-control form-control-solid bg-light" disabled [value]="indautorModel.id_registro"
            readonly />
        </div>
      </div>

      <!-- Denominación | Rama -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Denominación</label>
          <input type="text" class="form-control form-control-solid bg-light"
            [value]="indautorModel.denominacion || indautorModel.nombrePatente" disabled readonly />
        </div>
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Rama</label>
          <input type="text" class="form-control form-control-solid bg-light" disabled [value]="indautorModel.rama" readonly />
        </div>
      </div>

      <!-- Estatus | Medio de Ingreso -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Estatus</label>
          <div class="form-control form-control-solid d-flex align-items-center">
            <span class="badge" [ngClass]="{
                    'badge-light-success': indautorModel.estatus === 'Aprobada',
                    'badge-light-primary': indautorModel.estatus === 'Registrada',
                    'badge-light-warning': indautorModel.estatus === 'En trámite',
                    'badge-light-danger': indautorModel.estatus === 'Trámite con observaciones',
                    'badge-light-info': indautorModel.estatus === 'Concluida'
                  }" class="fs-7 fw-bold">
              {{ indautorModel.estatus }}
            </span>
          </div>
        </div>
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Medio de Ingreso</label>
          <input type="text" class="form-control form-control-solid bg-light" disabled [value]="indautorModel.medioIngreso"
            readonly />
        </div>
      </div>

      <!-- Tecnológico de Origen | CePat -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Tecnológico de Origen</label>
          <input type="text" class="form-control form-control-solid bg-light" disabled [value]="indautorModel.tecnologicoOrigen"
            readonly />
        </div>
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">CePat</label>
          <input type="text" class="form-control form-control-solid bg-light" disabled [value]="indautorModel.cePat" readonly />
        </div>
      </div>

      <!-- Año Renovación | Tipo de Sector -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Año Renovación</label>
          <input type="text" class="form-control form-control-solid bg-light" disabled [value]="indautorModel.anioRenovacion"
            readonly />
        </div>
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Tipo de Sector</label>
          <input type="text" class="form-control form-control-solid bg-light" disabled [value]="indautorModel.tipoSector"
            readonly />
        </div>
      </div>

      <!-- Sector | Subsector -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Sector</label>
          <input type="text" class="form-control form-control-solid bg-light" disabled [value]="indautorModel.sector" readonly />
        </div>
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Subsector</label>
          <input type="text" class="form-control form-control-solid bg-light" disabled [value]="indautorModel.subsector"
            readonly />
        </div>
      </div>

      <!-- Fecha de Solicitud | Fecha de Expedición -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Fecha de Solicitud</label>
          <input type="text" class="form-control form-control-solid bg-light" disabled [value]="indautorModel.fechaSolicitud"
            readonly />
        </div>
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Fecha de Expedición</label>
          <input type="text" class="form-control form-control-solid bg-light" disabled [value]="indautorModel.fechaExpedicion"
            readonly />
        </div>
      </div>

      <!-- Archivo | Observaciones -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Archivo</label>
          <div class="form-control form-control-solid bg-light d-flex align-items-center justify-content-between">
            <span *ngIf="indautorModel.archivo">
              <app-keenicon name="document" class="fs-5 me-2"></app-keenicon>
              {{ indautorModel.archivo }}
            </span>
            <span *ngIf="!indautorModel.archivo" class="text-muted">Sin archivo</span>
            <span *ngIf="indautorModel.archivo">
              <mat-icon style="color: black;" (click)="downloadDocument(indautorModel.archivo)">
                visibility
              </mat-icon>
            </span>
          </div>
        </div>
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Observaciones</label>
          <textarea class="form-control form-control-solid bg-light" [value]="indautorModel.observaciones" rows="3"
            readonly></textarea>
        </div>
      </div>

      <!-- Descripción -->
      <div class="fv-row mb-7">
        <label class="fw-semibold fs-6 mb-2 text-gray-600">Descripción</label>
        <textarea class="form-control form-control-solid bg-light" [value]="indautorModel.descripcion" rows="3"
          readonly></textarea>
      </div>

      <!-- Inventores (solo visualización) -->
      <div class="separator separator-dashed my-7" *ngIf="inventoresVisibles.length"></div>
      <div class="fw-bold fs-4 mb-4" *ngIf="inventoresVisibles.length">Inventores ({{ inventoresVisibles.length }})
      </div>

      <div *ngFor="let inv of inventoresVisibles; let i = index" class="card card-flush mb-5">
        <div class="card-header py-3">
          <div class="card-title fw-bold">Autor {{ i + 1 }}</div>
        </div>
        <div class="card-body pt-3">
          <div class="row g-6">
            <div class="col-md-6">
              <label class="form-label text-gray-600">CURP</label>
              <input class="form-control form-control-solid bg-light" [value]="inv.curp" readonly />
            </div>
            <div class="col-md-6">
              <label class="form-label text-gray-600">Nombre Completo</label>
              <input class="form-control form-control-solid bg-light" [value]="inv.nombre + ' ' + inv.apellidoPaterno + ' ' + inv.apellidoMaterno" readonly />
            </div>
            <div class="col-md-4">
              <input class="form-control form-control-solid bg-light" [value]="inv.sexo" readonly />
            </div>
            <div class="col-md-8">
              <label class="form-label text-gray-600">Tipo de investigador</label>
              <input class="form-control form-control-solid bg-light" [value]="inv.tipoInvestigador" readonly />
            </div>
            <div class="col-md-6">
              <label class="form-label text-gray-600">Institución</label>
              <input class="form-control form-control-solid bg-light" [value]="inv.institucion" readonly />
            </div>
            <div class="col-md-6">
              <label class="form-label text-gray-600">Programa Educativo</label>
              <input class="form-control form-control-solid bg-light" [value]="inv.programaEducativo" readonly />
            </div>
            <div class="col-md-6">
              <label class="form-label text-gray-600">Cuerpo Académico</label>
              <input class="form-control form-control-solid bg-light" [value]="inv.cuerpoAcademico" readonly />
            </div>
            <div class="col-md-6">
              <label class="form-label text-gray-600">Departamento</label>
              <input class="form-control form-control-solid bg-light" [value]="inv.departamento" readonly />
            </div>
            <div class="col-md-6">
              <label class="form-label text-gray-600">Fecha de Afiliación</label>
              <input class="form-control form-control-solid bg-light" [value]="inv.fechaAfiliacion" readonly />
            </div>
            <div class="col-md-6">
              <label class="form-label text-gray-600">Fecha de Fin</label>
              <input class="form-control form-control-solid bg-light" [value]="inv.fechaFin" readonly />
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-primary" (click)="closeForm(modal)" translate="BUTTON.CLOSE">
    </button>
  </div>
</ng-template>

<!-- ===================== MODAL EDITAR ===================== -->
<ng-template #formModalEdit let-modal>
  <div class="modal-header bg-warning">
    <h3 class="modal-title text-white">
      <app-keenicon name="pencil" class="fs-2 me-2 text-white"></app-keenicon>
      Editar Registro INDAUTOR
    </h3>
    <button type="button" class="btn-close btn-close-white" aria-label="Close"
      (click)="closeForm(modal)"></button>
  </div>

  <div class="modal-body">
    <div class="d-flex flex-column scroll-y me-n7 pe-7 mw-650px">
      <!-- N. Expediente | N. de Título -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">N. Expediente</label>
          <input type="text" class="form-control" disabled [(ngModel)]="indautorModel.numeroExpediente" />
        </div>
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">N. de Título</label>
          <input type="text" class="form-control" disabled [(ngModel)]="indautorModel.id_registro" />
        </div>
      </div>

      <!-- Denominación | Rama -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Denominación</label>
          <input type="text" class="form-control" [(ngModel)]="indautorModel.denominacion" />
        </div>

        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Rama</label>
          <select class="form-select form-select-sm" id="rama" name="rama" [(ngModel)]="indautorModel.rama_param">
            <option [ngValue]="null">Seleccione una rama</option>
            <option *ngFor="let r of ramasCatalogo" [ngValue]="r.id_param">
              {{ r.nombre }}
            </option>
          </select>
        </div>
      </div>

      <!-- Estatus | Medio de Ingreso -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Estatus</label>
          <select class="form-select" [(ngModel)]="indautorModel.estatus">
            <!--<option value="Registrada">Registrada</option>
            <option value="En trámite">En trámite</option>
            <option value="Trámite con observaciones">Trámite con observaciones</option>
            <option value="Aprobada">Aprobada</option>
            <option value="Concluida">Concluida</option>-->
            <option value="Confirmada">Confirmada</option>
            <option value="Pendiente">Pendiente</option>
            <option value="Con Observaciones">Con Observaciones</option>
            <option value="Rechazada">Rechazada</option>
            <option value="Finalizada">Finalizada</option>
            <option value="Cancelada">Cancelada</option>
            <option value="En pausa">En pausa</option>
            <option value="En espera de validación">En espera de validación</option>
            <option value="Notificada al Tecnológico">Notificada al Tecnológico</option>
          </select>
        </div>
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Medio de Ingreso</label>
          <select class="form-select form-select-sm" id="medioIngreso" name="medioIngreso"
            [(ngModel)]="indautorModel.medio_ingreso_param">
            <option [ngValue]="null">Seleccione un medio</option>
            <option *ngFor="let m of mediosIngresoCatalogo" [ngValue]="m.id_param">
              {{ m.nombre }}
            </option>
          </select>
        </div>
      </div>

      <!-- CePat | Tecnológico de Origen -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">CePat</label>
          <select id="cePat" class="form-select" name="cePat" [(ngModel)]="selectedCepatId"
            (ngModelChange)="onCepatChange($event)">
            <option [ngValue]="null" disabled>Seleccione un CEPA</option>
            <option *ngFor="let ce of cepatList" [ngValue]="ce.id_cepat">
              {{ ce.nombre }}
            </option>
          </select>
        </div>
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Tecnológico de Origen</label>
          <select id="tecnologicoOrigen" class="form-select" name="tecnologicoOrigen"
            [disabled]="!selectedCepatId && !institucionSeleccionadaCepat" [(ngModel)]="institucionSeleccionadaCepat"
            (ngModelChange)="onInstitucionCepatChange($event)">
            <option [ngValue]="null" disabled>
              {{ !selectedCepatId ? 'Seleccione primero un CEPA' : 'Seleccione una institución' }}
            </option>

            <option *ngFor="let inst of institucionesCepat" [ngValue]="inst.id_institucion">
              {{ inst.nombre }}
            </option>
          </select>
        </div>
      </div>

      <!-- Año Renovación | Tipo de Sector -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Año Renovación</label>
          <select class="form-select form-select-sm" id="anioRenovacion" name="anioRenovacion"
            [(ngModel)]="indautorModel.anioRenovacion">
            <option [ngValue]="'N/A'">N/A</option>
            <option *ngFor="let anio of aniosRenovacion" [ngValue]="anio.toString()">
              {{ anio }}
            </option>
          </select>
        </div>
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Tipo de Sector</label>
          <select class="form-select" id="tipoSector" name="tipoSector" [(ngModel)]="tipoSectorSeleccionadoId"
            (change)="onTipoSectorChange($event)" [disabled]="isEditingStatus">
            <option [ngValue]="null">Seleccione un tipo de sector</option>
            <option *ngFor="let tipo of tiposSectorCatalogo" [ngValue]="tipo.id_param">
              {{ tipo.nombre }}
            </option>
          </select>
        </div>
      </div>

      <!-- Sector | Subsector -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Sector</label>
          <select class="form-select" id="sector" name="sector" [(ngModel)]="sectorSeleccionadoId"
            (change)="onSectorChange($event)" [disabled]="isEditingStatus || !tipoSectorSeleccionadoId">
            <option [ngValue]="null">{{ !tipoSectorSeleccionadoId ? 'Seleccione primero un tipo de sector' : 'Seleccione un sector' }}</option>
            <option *ngFor="let s of sectoresFiltrados" [ngValue]="s.id_param">
              {{ s.nombre }}
            </option>
          </select>
        </div>
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Subsector</label>
          <select class="form-select" id="subsector" name="subsector" [(ngModel)]="subsectorIdSeleccionado"
            (change)="onSubsectorChange($event)" [disabled]="isEditingStatus || !sectorSeleccionadoId">
            <option [ngValue]="null">{{ !sectorSeleccionadoId ? 'Seleccione primero un sector' : 'Seleccione un subsector' }}</option>
            <option *ngFor="let sub of subsectoresFiltrados" [ngValue]="sub.id_param">
              {{ sub.nombre }}
            </option>
          </select>
        </div>
      </div>

      <!-- Fecha de Solicitud | Fecha de Expedición -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Fecha de Solicitud</label>
          <input type="date" class="form-control" [(ngModel)]="indautorModel.fechaSolicitud" />
        </div>
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Fecha de Expedición</label>
          <input type="date" class="form-control" [(ngModel)]="indautorModel.fechaExpedicion" />
        </div>
      </div>

      <!-- Archivo | Observaciones -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Archivo</label>
          <input type="file" class="form-control" accept=".pdf" (change)="onArchivoSelected($event)" #archivoInput />

          <!-- Información del archivo actual -->
          <div *ngIf="indautorModel.archivo && !filePreviewUrl" class="mt-2 d-flex align-items-center justify-content-between p-2 bg-light rounded">
            <small class="text-muted d-flex align-items-center">
              <app-keenicon name="document" class="fs-5 me-2"></app-keenicon>
              <span>Archivo actual: <strong>{{ indautorModel.archivo }}</strong></span>
            </small>
            <span>
              <mat-icon style="color: black;" (click)="downloadDocument(indautorModel.archivo)">
                visibility
              </mat-icon>
            </span>
          </div>

          <!-- Sin archivo -->
          <div *ngIf="!indautorModel.archivo" class="mt-2">
            <small class="text-muted">
              <app-keenicon name="information" class="fs-5 me-1"></app-keenicon>
              Sin archivo
            </small>
          </div>
        </div>
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Observaciones</label>
          <textarea class="form-control" rows="3" [(ngModel)]="indautorModel.observaciones"></textarea>
        </div>
      </div>

      <!-- Previsualización del archivo PDF -->
      <div class="row g-9 mb-7" *ngIf="filePreviewUrl">
        <div class="fv-row col-md-12">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">
            <app-keenicon name="eye" class="fs-5 me-1"></app-keenicon>
            Previsualización del PDF
          </label>
          <div class="card">
            <div class="card-body p-0">
              <iframe [src]="getSafeUrl(filePreviewUrl)"
                      width="100%"
                      height="500px"
                      style="border: none;">
              </iframe>
            </div>
          </div>
        </div>
      </div>

      <!-- Descripción -->
      <div class="fv-row mb-7">
        <label class="fw-semibold fs-6 mb-2 text-gray-600">Descripción</label>
        <textarea class="form-control" rows="3" [(ngModel)]="indautorModel.descripcion"></textarea>
      </div>
<div class="separator separator-dashed my-7"></div>

<div class="d-flex align-items-center justify-content-between mb-4">
  <div class="fw-bold fs-4">Inventores</div>
  <button type="button" class="btn btn-sm btn-primary" (click)="addInventor()">
    Agregar autor
  </button>
</div>

<div
  *ngFor="let inv of indautorModel.inventores; let i = index"
  class="card card-flush mb-5"
>
  <div class="card-header py-3">
    <div class="card-title fw-bold">Autor {{ i + 1 }}</div>
    <div class="card-toolbar" *ngIf="i > 0">
      <button
        type="button"
        class="btn btn-sm btn-light-danger"
        (click)="removeInventor(i)"
      >
        Quitar
      </button>
    </div>
  </div>

  <div class="card-body pt-3">
    <div class="row g-6">

      <!-- CURP -->
<div class="col-md-6">
  <label class="form-label text-gray-600">CURP</label>
<select
  class="form-select"
  [(ngModel)]="inv.curp"
  (change)="onCurpChange(inv)"
  
>
  <option value="">Seleccione CURP</option>
  <option *ngFor="let persona of listaInvestigadores" [value]="persona.curp">
    {{ persona.curp }}
  </option>
</select>
</div>


      <!-- Nombre -->
