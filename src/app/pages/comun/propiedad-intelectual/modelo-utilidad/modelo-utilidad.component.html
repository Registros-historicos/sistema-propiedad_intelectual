<div class="card">
  <div class="card-header border-0 pt-6">
    <div class="card-title">
      <div class="d-flex align-items-center position-relative my-1">
        <app-keenicon name="magnifier" class="fs-3 position-absolute ms-5"></app-keenicon>
        <input type="text" data-action="filter" class="form-control form-control-solid w-250px ps-12"
               [placeholder]="placeholder">
      </div>
    </div>

    <div class="card-toolbar">
      <div class="d-flex justify-content-end align-items-center">
        <div class="d-flex align-items-center me-4">
          <label class="form-label text-gray-600 me-3 mb-0 fw-semibold" translate="TABLE.PAGE_LENGTH.LABEL"></label>
          <select class="form-select form-select-sm form-select-solid w-auto" (change)="onPageLengthChange($event)"
                  [(ngModel)]="pageLength">
            <option *ngFor="let length of lengthMenu" [value]="length">{{ length }}</option>
          </select>
          <span class="text-gray-600 ms-2 fw-semibold" translate="TABLE.PAGE_LENGTH.RECORDS"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="card-body pt-0">
    <app-crud
      [datatableConfig]="datatableConfig"
      route="/coordinador/propiedades/modelo-utilidad"
      (deleteEvent)="delete($event)"
      (editEvent)="edit($event)"
      (viewEvent)="view($event)"
      [reload]="reloadEvent"
      [modal]="isViewMode ? formModal : formModalEdit">
    </app-crud>
  </div>
</div>

<swal #noticeSwal [swalOptions]="swalOptions"></swal>

<!-- ===================== MODAL VER ===================== -->
<ng-template #formModal let-modal>
  <div class="modal-header">
    <h3 class="modal-title">REGISTROS INDAUTOR</h3>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
  </div>

  <div class="modal-body">
    <div class="d-flex flex-column scroll-y me-n7 pe-7 mw-650px">

      <!-- Aviso -->
      <div class="notice d-flex bg-light-info rounded border-info border border-dashed mb-7 p-6">
        <app-keenicon name="information-5" class="fs-2tx text-info me-4"></app-keenicon>
        <div class="d-flex flex-stack flex-grow-1">
          <div class="fw-semibold">
            <h4 class="text-gray-900 fw-bold">Detalle de registro</h4>
            <div class="fs-6 text-gray-700">Consulta la información registrada en INDAUTOR.</div>
          </div>
        </div>
      </div>

      <!-- ID + Expediente -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-4">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">ID</label>
          <input class="form-control form-control-solid bg-light" [value]="indautorModel.id" readonly />
        </div>
        <div class="fv-row col-md-8">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">N. Expediente</label>
          <input class="form-control form-control-solid bg-light" [value]="indautorModel.numeroExpediente" readonly />
        </div>
      </div>

      <!-- Título | Rama -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-8">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Título</label>
          <input class="form-control form-control-solid bg-light" [value]="indautorModel.titulo" readonly />
        </div>
        <div class="fv-row col-md-4">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Rama</label>
          <input class="form-control form-control-solid bg-light" [value]="indautorModel.rama" readonly />
        </div>
      </div>

      <!-- Estatus | Medio de ingreso -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Estatus</label>
          <div class="form-control form-control-solid d-flex align-items-center bg-light">
            <span class="badge"
                  [ngClass]="{
                    'badge-light-success': indautorModel.estatus === 'Aprobada',
                    'badge-light-primary': indautorModel.estatus === 'Registrada',
                    'badge-light-warning': indautorModel.estatus === 'Trámite con observaciones',
                    'badge-light-info': indautorModel.estatus === 'En trámite',
                    'badge-light-secondary': indautorModel.estatus === 'Concluida'
                  }"
                  class="fs-7 fw-bold">
              {{ indautorModel.estatus }}
            </span>
          </div>
        </div>
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Medio de Ingreso</label>
          <input class="form-control form-control-solid bg-light" [value]="indautorModel.medioIngreso" readonly />
        </div>
      </div>

      <!-- Tipo de sector | Fecha de Solicitud -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Tipo de Sector</label>
          <input class="form-control form-control-solid bg-light" [value]="indautorModel.tipoSector" readonly />
        </div>
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Fecha de Solicitud</label>
          <input class="form-control form-control-solid bg-light" [value]="indautorModel.fechaSolicitud" readonly />
        </div>
      </div>

      <!-- Fecha de Expedición | Archivo -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Fecha de Expedición</label>
          <input class="form-control form-control-solid bg-light" [value]="indautorModel.fechaExpedicion" readonly />
        </div>
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Archivo</label>
          <input class="form-control form-control-solid bg-light" [value]="indautorModel.archivo" readonly />
        </div>
      </div>

      <!-- Observaciones (full) -->
      <div class="fv-row mb-7">
        <label class="fw-semibold fs-6 mb-2 text-gray-600">Observaciones</label>
        <textarea class="form-control form-control-solid bg-light" [value]="indautorModel.observaciones" rows="3" readonly></textarea>
      </div>

      <!-- Descripción (full) -->
      <div class="fv-row mb-7">
        <label class="fw-semibold fs-6 mb-2 text-gray-600">Descripción</label>
        <textarea class="form-control form-control-solid bg-light" [value]="indautorModel.descripcion" rows="3" readonly></textarea>
      </div>

      <!-- Inventores (si existen) -->
      <div class="separator separator-dashed my-7" *ngIf="inventoresVisibles.length"></div>
      <div class="fw-bold fs-4 mb-4" *ngIf="inventoresVisibles.length">Inventores ({{ inventoresVisibles.length }})</div>
      <div *ngFor="let inv of inventoresVisibles; let i = index" class="card card-flush mb-5">
        <div class="card-header py-3">
          <div class="card-title fw-bold">Autor {{ i + 1 }}</div>
        </div>
        <div class="card-body pt-3">
          <div class="row g-6">
            <div class="col-md-6">
              <label class="form-label text-gray-600">CURP</label>
              <input class="form-control form-control-solid bg-light" [value]="inv.curp" readonly />
            </div>
            <div class="col-md-6">
              <label class="form-label text-gray-600">Nombre Completo</label>
              <input class="form-control form-control-solid bg-light" [value]="inv.nombreCompleto" readonly />
            </div>
          </div>
        </div>
      </div>

      <!-- ===== COMENTADO (conservado): Número de Certificado =====
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">N. Certificado</label>
          <input class="form-control form-control-solid bg-light" [value]="indautorModel.numeroCertificado" readonly />
        </div>
      </div>
      -->

    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-primary" (click)="closeForm(modal)">Cerrar</button>
  </div>
</ng-template>

<!-- ===================== MODAL EDITAR ===================== -->
<ng-template #formModalEdit let-modal>
  <div class="modal-header bg-warning">
    <h3 class="modal-title text-white">
      <app-keenicon name="pencil" class="fs-2 me-2 text-white"></app-keenicon>
      Editar Registro INDAUTOR
    </h3>
    <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
  </div>

  <div class="modal-body">
    <div class="d-flex flex-column scroll-y me-n7 pe-7 mw-650px">

      <!-- ID + N. Expediente -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-4">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">ID</label>
          <input class="form-control form-control-solid bg-light" [value]="indautorModel.id" readonly />
        </div>
        <div class="fv-row col-md-8">
          <label class="required fw-semibold fs-6 mb-2 text-gray-600">N. Expediente</label>
          <input class="form-control" [(ngModel)]="indautorModel.numeroExpediente" />
        </div>
      </div>

      <!-- Título | Rama -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-8">
          <label class="required fw-semibold fs-6 mb-2 text-gray-600">Título</label>
          <input class="form-control" [(ngModel)]="indautorModel.titulo" />
        </div>
        <div class="fv-row col-md-4">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Rama</label>
          <select class="form-select" [(ngModel)]="selectedRamaId">
            <option [ngValue]="null">Seleccione...</option>
            <option *ngFor="let r of ramasCatalogo" [ngValue]="r.id_param">{{ r.nombre }}</option>
          </select>
        </div>
      </div>

      <!-- Estatus | Medio de Ingreso -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Estatus</label>
          <select class="form-select" [(ngModel)]="indautorModel.estatus">
            <option value="">Seleccione...</option>
            <option *ngFor="let e of estatusOptions" [value]="e">{{ e }}</option>
          </select>
        </div>
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Medio de Ingreso</label>
          <select class="form-select" [(ngModel)]="selectedMedioIngresoId">
            <option [ngValue]="null">Seleccione...</option>
            <option *ngFor="let m of mediosIngresoCatalogo" [ngValue]="m.id_param">{{ m.nombre }}</option>
          </select>
        </div>
      </div>

      <!-- Tipo de Sector | Fecha de Solicitud -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Tipo de Sector</label>
          <select class="form-select" [(ngModel)]="selectedTipoSectorId">
            <option [ngValue]="null">Seleccione...</option>
            <option *ngFor="let s of tiposSectorCatalogo" [ngValue]="s.id_param">{{ s.nombre }}</option>
          </select>
        </div>
        <div class="fv-row col-md-6">
          <label class="required fw-semibold fs-6 mb-2 text-gray-600">Fecha de Solicitud</label>
          <input type="date" class="form-control" [(ngModel)]="indautorModel.fechaSolicitud" />
        </div>
      </div>

      <!-- Fecha de Expedición | Archivo -->
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Fecha de Expedición</label>
          <input type="date" class="form-control" [(ngModel)]="indautorModel.fechaExpedicion" />
        </div>
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">Archivo</label>
          <input class="form-control" [(ngModel)]="indautorModel.archivo" />
        </div>
      </div>

      <!-- Observaciones (full) -->
      <div class="fv-row mb-7">
        <label class="fw-semibold fs-6 mb-2 text-gray-600">Observaciones</label>
        <textarea class="form-control" rows="3" [(ngModel)]="indautorModel.observaciones"></textarea>
      </div>

      <!-- Descripción (full) -->
      <div class="fv-row mb-7">
        <label class="fw-semibold fs-6 mb-2 text-gray-600">Descripción</label>
        <textarea class="form-control" rows="3" [(ngModel)]="indautorModel.descripcion"></textarea>
      </div>

      <!-- Inventores -->
      <div class="separator separator-dashed my-7"></div>
      <div class="d-flex align-items-center justify-content-between mb-4">
        <div class="fw-bold fs-4">Inventores</div>
        <button type="button" class="btn btn-sm btn-primary" (click)="addInventor()">
          <app-keenicon name="plus" class="fs-5 me-1"></app-keenicon>
          Agregar inventor
        </button>
      </div>

      <!-- ===== COMENTADO (conservado): Número de Certificado =====
      <div class="row g-9 mb-7">
        <div class="fv-row col-md-6">
          <label class="fw-semibold fs-6 mb-2 text-gray-600">N. Certificado</label>
          <input class="form-control" [(ngModel)]="indautorModel.numeroCertificado" />
        </div>
      </div>
      -->

    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-light" (click)="closeForm(modal)">Cancelar</button>
    <button type="button" class="btn btn-warning" (click)="saveEdit(modal)">Guardar</button>
  </div>
</ng-template>
