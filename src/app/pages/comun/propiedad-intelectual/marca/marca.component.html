<div class="card">
  <div class="card-header border-0 pt-6">
    <!--begin::Card title-->
    <div class="card-title">
      <!--begin::Search-->
      <div class="d-flex align-items-center position-relative my-1">
        <app-keenicon name="magnifier" class="fs-3 position-absolute ms-5"></app-keenicon>
        <input type="text" data-action="filter" class="form-control form-control-solid w-250px ps-12"
          [placeholder]="placeholder">
      </div>
      <!--end::Search-->
    </div>
    <!--begin::Card title-->

    <!--begin::Card toolbar-->
    <div class="card-toolbar">
      <!--begin::Toolbar-->
      <div class="d-flex justify-content-end align-items-center">
        <label class="form-label text-gray-600 me-3 mb-0 fw-semibold" translate="TABLE.PAGE_LENGTH.LABEL"></label>
        <select class="form-select form-select-sm form-select-solid w-auto" (change)="onPageLengthChange($event)"
          [(ngModel)]="pageLength">
          <option *ngFor="let length of lengthMenu" [value]="length">{{length}}</option>
        </select>
        <span class="text-gray-600 ms-2 fw-semibold" translate="TABLE.PAGE_LENGTH.RECORDS"></span>
      </div>
      <!--end::Toolbar-->
    </div>
    <!--end::Card toolbar-->
  </div>

  <div class="card-body pt-0">
    <app-crud [datatableConfig]="datatableConfig" route="/administrador/propiedades/patente" (viewEvent)="view($event)"
      (deleteEvent)="delete($event)" [reload]="reloadEvent" [modal]="formModal"></app-crud>
  </div>
</div>

<swal #noticeSwal [swalOptions]="swalOptions"></swal>

<ng-template #formModal let-modal>
  <div class="modal-header">
    <h3 class="modal-title">
      <span translate="MODAL.TITLE"></span>
    </h3>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
  </div>

  <div class="modal-body">
    <div class="d-flex flex-column scroll-y me-n7 pe-7 mw-650px">

      <div class="notice d-flex bg-light-info rounded border-info border border-dashed mb-7 p-6">
        <app-keenicon name="information-5" class="fs-2tx text-info me-4"></app-keenicon>
        <div class="d-flex flex-stack flex-grow-1">
          <div class="fw-semibold">
            <h4 class="text-gray-900 fw-bold" translate="MODAL.INFO.TITLE"></h4>
            <div class="fs-6 text-gray-700">
              <span translate="MODAL.INFO.BODY"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="fv-row mb-7">
        <label class="fw-semibold fs-6 mb-2 text-gray-600" translate="MODAL.FORM.MARK.NAME"></label>
        <input type="text" class="form-control form-control-solid bg-light" [value]="marcaModel.denominacion"
          readonly />
      </div>

      <div class="row g-9 mb-7">
        <div class="fv-row col-md-4">
          <label class="fw-semibold fs-6 mb-2 text-gray-600" translate="MODAL.FORM.MARK.RECORD"></label>
          <input type="text" class="form-control form-control-solid bg-light" [value]="marcaModel.expediente"
            readonly />
        </div>

        <div class="fv-row col-md-8">
          <label class="fw-semibold fs-6 mb-2 text-gray-600" translate="MODAL.FORM.MARK.APPLICATION_TYPE"></label>
          <input type="text" class="form-control form-control-solid bg-light" [value]="marcaModel.tipoSolicitud"
            readonly />
        </div>
      </div>

      <div class="row g-9 mb-7">
        <div class="fv-row col-md-4">
          <label class="fw-semibold fs-6 mb-2 text-gray-600" translate="MODAL.FORM.MARK.DATE"></label>
          <input type="text" class="form-control form-control-solid bg-light" [value]="marcaModel.fechaPresentacion"
            readonly />
        </div>

        <div class="fv-row col-md-4">
          <label class="fw-semibold fs-6 mb-2 text-gray-600" translate="MODAL.FORM.MARK.DATE_GRANT"></label>
          <input type="text" class="form-control form-control-solid bg-light" [value]="marcaModel.fechaConcesion"
            readonly />
        </div>

        <div class="fv-row col-md-4">
          <label class="fw-semibold fs-6 mb-2 text-gray-600" translate="MODAL.FORM.MARK.DATE_COMPLETION"></label>
          <input type="text" class="form-control form-control-solid bg-light" [value]="marcaModel.fechaTerminacion"
            readonly />
        </div>
      </div>

      <div class="row g-9 mb-7" *ngIf="marcaModel.inicioUso">
        <div class="fv-row col-md-4">
          <label class="fw-semibold fs-6 mb-2 text-gray-600" translate="MODAL.FORM.MARK.DATE_START"></label>
          <input type="text" class="form-control form-control-solid bg-light" [value]="marcaModel.inicioUso" readonly />
        </div>

        <div class="fv-row col-md-8">
          <label class="fw-semibold fs-6 mb-2 text-gray-600" translate="MODAL.FORM.MARK.APPLICANT"></label>
          <input type="text" class="form-control form-control-solid bg-light" [value]="marcaModel.titular" readonly />
        </div>
      </div>

      <div class="fv-row mb-7" *ngIf="!marcaModel.inicioUso">
        <label class="fw-semibold fs-6 mb-2 text-gray-600" translate="MODAL.FORM.MARK.APPLICANT"></label>
        <input type="text" class="form-control form-control-solid bg-light" [value]="marcaModel.titular" readonly />
      </div>

      <div class="fv-row mb-7">
        <label class="fw-semibold fs-6 mb-2 text-gray-600" translate="MODAL.FORM.MARK.IMAGE"></label>
        <div class="d-flex align-items-center">
          <div class="symbol symbol-100px me-4">
            <img [src]="marcaModel.marca" [alt]="marcaModel.denominacion" class="symbol-label bg-light"
              style="object-fit: contain; width: 100px; height: 100px;"
              onerror="this.onerror=null;this.src='https://via.placeholder.com/100?text=Sin+Imagen';" />
          </div>
          <div class="flex-grow-1">
            <div class="fw-bold text-gray-800 fs-6">{{marcaModel.denominacion}}</div>
            <div class="text-muted fs-7"><span translate="MODAL.FORM.MARK.IMAGE_INFO"></span></div>
          </div>
        </div>
      </div>

      <div class="fw-bold fs-3 rotate collapsible mb-7" data-bs-toggle="collapse" role="button"
        (click)="collapse2.toggle()" [attr.aria-expanded]="!isCollapsed2"
        aria-controls="kt_modal_update_marca_tramites">
        <app-keenicon name="document" class="fs-3 me-2"></app-keenicon>
        <span translate="MODAL.FORM.MARK.FORMALITIES.LABEL"></span>
        <span class="ms-2 rotate-180">
          <i class="ki-duotone ki-down fs-3" [ngClass]="{ 'ki-up': !isCollapsed2 }"></i>
        </span>
      </div>

      <div class="collapse" #collapse2="ngbCollapse" [(ngbCollapse)]="isCollapsed2">
        <div class="card card-flush">
          <div class="card-body pt-0">
            <div *ngIf="marcaModel.tramites && marcaModel.tramites.length > 0; else noTramites">
              <div *ngFor="let tramite of marcaModel.tramites; let i = index"
                class="d-flex align-items-start border border-gray-300 border-dashed rounded p-4 mb-3">

                <div class="symbol symbol-50px me-4">
                  <div class="symbol-label bg-light-success">
                    <app-keenicon name="document" class="fs-2 text-success"></app-keenicon>
                  </div>
                </div>

                <div class="flex-grow-1">
                  <div class="fw-bold text-gray-800 fs-6 mb-2">{{tramite.descripcion}}</div>
                  <div class="row g-3">
                    <div class="col-md-4">
                      <div class="text-muted fs-7 mb-1"><span translate="MODAL.FORM.MARK.FORMALITIES.ENTRY_FOLIO"></span></div>
                      <div class="fw-semibold text-gray-700 fs-7">{{tramite.folioEntrada}}</div>
                    </div>
                    <div class="col-md-4">
                      <div class="text-muted fs-7 mb-1"><span translate="MODAL.FORM.MARK.FORMALITIES.YEAR_RECEPTION"></span></div>
                      <div class="fw-semibold text-gray-700 fs-7">{{tramite.anioRecepcion}}</div>
                    </div>
                    <div class="col-md-4" *ngIf="tramite.inicio">
                      <div class="text-muted fs-7 mb-1"><span translate="MODAL.FORM.MARK.FORMALITIES.START_DATE"></span></div>
                      <div class="fw-semibold text-gray-700 fs-7">{{tramite.inicio}}</div>
                    </div>
                  </div>
                  <div class="row g-3 mt-2" *ngIf="tramite.conclusion">
                    <div class="col-md-4">
                      <div class="text-muted fs-7 mb-1"><span translate="MODAL.FORM.MARK.FORMALITIES.COMPLETION_DATE"></span></div>
                      <div class="fw-semibold text-gray-700 fs-7">{{tramite.conclusion}}</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <ng-template #noTramites>
              <div class="text-center py-8">
                <app-keenicon name="document" class="fs-3x text-muted mb-4"></app-keenicon>
                <div class="text-muted fs-6" translate="MODAL.FORM.MARK.FORMALITIES_EMPTY"></div>
              </div>
            </ng-template>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-primary" (click)="closeForm(modal)" translate="BUTTON.CLOSE">
    </button>
  </div>
</ng-template>
