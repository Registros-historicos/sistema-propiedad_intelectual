<div class="visor-container">
  <div class="reports-title">
    <button type="button" class="btn btn btn-secondary me-3" (click)="back()">Regresar</button>
    <h2>{{ filename || 'Reporte.pdf' }}</h2>
  </div>
  <!-- Mostrar visor PDF (dependiendo de la url o la ruta) o mensaje de error -->
  <div class="visor-wrapper" *ngIf="pdfUrl; else err">
    <object class="visor-pdf"
            [data]="pdfUrl"
            type="application/pdf">
      <p>
        Su navegador no puede mostrar el PDF incrustado.
        <a [href]="pdfUrl" target="_blank" rel="noopener">Abrir en nueva pestaña</a>
      </p>
    </object>
  </div>

  <ng-template #err>
    <div class="error">{{ errorMsg }}</div>
  </ng-template>
</div>
