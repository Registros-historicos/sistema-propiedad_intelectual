<div class="row g-5 g-xl-8">
  <!-- Institutos Federales -->
  <div class="col-xl-6">
    <app-tablero-institutos-general
      titulo="Institutos Tecnológicos Federales"
      [tipoInstitucion]="123"
      [data]="dataFederalInstitutes"
      (retry)="loadRegisterInstitutes(123)"
      (exportExcel)="exportExcelFederalInstitutes()"
    ></app-tablero-institutos-general>
  </div>

  <!-- Institutos Descentralizados -->
  <div class="col-xl-6">
    <app-tablero-institutos-general
      titulo="Institutos Descentralizados"
      [tipoInstitucion]="122"
      [data]="dataDecentralizedInstitutes"
      (retry)="loadRegisterInstitutes(122)"
      (exportExcel)="exportExcelDecentralizedInstitutes()"
    ></app-tablero-institutos-general>
  </div>
</div>

<div class="row g-5 g-xl-8">

  <!-- Inserción temporal: listado de coordinadores CEPAT para pruebas 
  <div class="col-xl-12 mb-6">
    <app-coordinator-listing-cepat></app-coordinator-listing-cepat>
  </div>
-->

  <!-- Tablero de Institutos Tecnológicos Federales -->
  <div class="col-xl-6">
    <!-- Componente de Tabla o Gráfico -->
    <app-tablero-top10-instituciones 
    [instituciones]="dataTop10Institutions"
    (exportExcel)="exportExcelTop10Institutions()"
    ></app-tablero-top10-instituciones> 
  </div>

  <!-- Tablero de Institutos Tecnológicos Descentralizados -->
  <div class="col-xl-6">
    <app-tablero-all-institutions 
    titulo="Todas las Instituciones"
    (exportExcel)="exportExcelAllInstitutions()"
    ></app-tablero-all-institutions>
  </div>
</div>

<div class="row g-5 g-xl-8">

  <!-- Tablero de Registros por Sector -->
  <div class="col-xl-6">
    <!-- Componente de Tabla o Gráfico -->
    <app-grafica-sector
    (exportExcel)="exportExcelSector()"
    ></app-grafica-sector>
  </div>

  <!-- Tablero de Registros por Estatus -->
  <div class="col-xl-6">
    <!-- Componente de Tabla o Gráfico -->
    <app-registro-estatus 
    class="card card-xl-stretch mb-xl-8"
    (exportExcel)="exportExcelRegisterByStatus()"
    ></app-registro-estatus>
  </div>
  <div class="row g-5 g-xl-8">

  <!-- Tablero de Solicitudes IMPI -->
  <div class="col-xl-6">
    <!-- Componente de Tabla o Gráfico -->
    <app-grafica-solicitudes (exportExcel)="exportExcelRegisterImpi()"></app-grafica-solicitudes>
  </div>

  <!-- Tablero de Solicitudes INDAUTOR -->
  <div class="col-xl-6">
    <!-- Componente de Tabla o Gráfico -->
    <app-grafica-solicitudes-in (exportExcel)="exportExcelRegisterIndautor()"></app-grafica-solicitudes-in>

    <!-- end::Table -->
  </div>
</div>

<div class="row g-5 g-xl-8">

  <!-- Tablero de Registros por Sexo -->
  <div class="col-xl-6">
    <!-- Componente de Tabla o Gráfico -->
    <app-registros-sexo
    class="card card-xl-stretch mb-xl-8"
    (exportExcel)="exportExcelRegisterByGender()"
    ></app-registros-sexo>
  </div>

  <!-- Tablero por Año -->
  <div class="col-xl-6">
    <!-- Componente de Tabla o Gráfico -->
  <!-- No pasar datos mock desde este dashboard; dejar que el componente cargue datos reales en ngOnInit -->
  <app-registros-anio class="card card-xl-stretch mb-xl-8"
  (exportExcel)="exportExcelReportByYear($event)"
  ></app-registros-anio>

    <!-- end::Table -->
  </div>
</div>

<div class="row g-5 g-xl-8">

  
  <!-- Tablero de Solicitudes INDAUTOR -->
  <div class="col-xl-6">
  </div>
</div>
